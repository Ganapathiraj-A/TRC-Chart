name: Build and Publish Latest APK

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK to TRC_Chart.apk
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TRC_Chart.apk

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TRC Chart Latest Release"
          body: "Automated latest build of TRC Chart APK."
          files: app/build/outputs/apk/debug/TRC_Chart.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
